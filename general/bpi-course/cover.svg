<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2332" stroke-width="1"/>
    </pattern>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#141b24"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1200" fill="url(#bgGrad)"/>
  <rect width="1200" height="1200" fill="url(#grid)" opacity="0.6"/>

  <!-- Accent lines -->
  <line x1="320" y1="430" x2="880" y2="430" stroke="#f26522" stroke-width="2" opacity="0.6"/>
  <line x1="320" y1="770" x2="880" y2="770" stroke="#f26522" stroke-width="2" opacity="0.6"/>

  <!-- Orange circle with BPI -->
  <circle cx="600" cy="600" r="170" fill="none" stroke="#f26522" stroke-width="4"/>
  <circle cx="600" cy="600" r="162" fill="#f26522" opacity="0.08"/>

  <text x="600" y="620" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="120" font-weight="900" fill="#f26522" letter-spacing="12">BPI</text>

  <!-- Course name -->
  <text x="600" y="830" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#8b949e" letter-spacing="1">Business Process Intelligence</text>

  <!-- Chinese subtitle -->
  <text x="600" y="875" text-anchor="middle" font-family="Arial, Helvetica, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="26" fill="#6e7681">过程挖掘 · 流程智能</text>

  <!-- Institution line -->
  <text x="600" y="920" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#484f58" letter-spacing="2">RWTH Aachen · SS 2026</text>

  <!-- Speaker info -->
  <text x="600" y="350" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#484f58" letter-spacing="3">课程播客</text>

</svg>
